# Bitmind Canonical Nginx Configuration
# Single source of truth for getbitmind.com
# Location: /etc/nginx/sites-available/getbitmind.com

# HTTP Server Block - Redirect to HTTPS
server {
    listen 80;
    server_name getbitmind.com www.getbitmind.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS Server Block - Proxy to Backend
server {
    listen 443 ssl http2;
    server_name getbitmind.com www.getbitmind.com;

    # SSL Configuration - Let's Encrypt Certificates
    ssl_certificate /etc/letsencrypt/live/getbitmind.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getbitmind.com/privkey.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy ALL traffic to backend
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (Upgrade headers)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        # NOTE: proxy_buffering off is useful for debugging WebSocket
        # For production with high traffic, consider enabling buffering:
        # proxy_buffering on;
        # proxy_request_buffering on;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Logging
    access_log /var/log/nginx/getbitmind_access.log;
    error_log /var/log/nginx/getbitmind_error.log;
}
